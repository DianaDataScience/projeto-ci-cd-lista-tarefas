name: Continuous Delivery

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - configurar-ci-cd

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v7

      - name: Prepare project package
        run: |
          rm -rf dist
          mkdir dist
          cp index.html style.css script.js README.md dist/

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: lista-de-tarefas-site
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v7
        with:
          name: lista-de-tarefas-site
          path: dist

      - name: Validate delivery package
        run: |
          test -f dist/index.html
          test -f dist/style.css
          test -f dist/script.js
          test -f dist/README.md
          echo "Pacote pronto para entrega."

