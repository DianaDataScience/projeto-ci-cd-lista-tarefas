name: Continuous Delivery

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - configurar-ci-cd

jobs:
  package-project:
    name: Prepare delivery package
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Prepare project package
        run: |
          rm -rf dist
          mkdir dist
          cp index.html style.css script.js README.md dist/

      - name: Upload delivery package
        uses: actions/upload-artifact@v4
        with:
          name: lista-de-tarefas-site
          path: dist
