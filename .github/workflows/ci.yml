name: Continuous Integration

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - configurar-ci-cd

jobs:
  validate-project:
    name: Validate project
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Check required files
        run: |
          test -f index.html
          test -f style.css
          test -f script.js
          test -f README.md

      - name: Check HTML connections
        run: |
          grep -q "stylesheet" index.html
          grep -q "script.js" index.html
          grep -q "task-form" index.html

      - name: Check JavaScript
        run: |
          grep -q "addEventListener" script.js
          grep -q "task-list" script.js
